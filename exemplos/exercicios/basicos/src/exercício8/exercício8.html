<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
</head>

<body>
    <h1>Gerenciador de Tarefas</h1>
    <label for="novaTarefa">Nova Tarefa:</label>
    <input type="text" id="novaTarefa" placeholder="Digite a nova tarefa">
    <button onclick="adicionarTarefa()">Adicionar</button>

    <ul id="listaTarefas"></ul>

    <script>
        let listaTarefas = [];

        function adicionarTarefa() {
            var novaTarefa = document.getElementById('novaTarefa').value.trim();
            if (novaTarefa !== '') {
                listaTarefas.push(novaTarefa);
                atualizarListaTarefas();
                document.getElementById('novaTarefa').value = '';
            } else {
                alert("Por favor, digite uma tarefa válida.");
            }
        }

        function removerTarefa(indice) {
            listaTarefas.splice(indice, 1);
            atualizarListaTarefas();
        }

        function atualizarListaTarefas() {
            var listaTarefasHtml = '';
            for (const task of listaTarefas) {
                listaTarefasHtml += `<li>${task} <button onclick="removerTarefa(${listaTarefas.indexOf(task)})">Remover</button></li>`;
            }
            document.getElementById('listaTarefas').innerHTML = listaTarefasHtml;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.global.min.js"></script>
    <script src="MyImage.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body>
    <div id="app">
      <div v-for="(image, index) in images" :key="index">
        <my-image
          :link="image.link"
          :description="image.description"
        ></my-image>
      </div>
    </div>
    <script type="module">
      import MyImage from "./MyImage.js";

      const app = Vue.createApp({
        data() {
          return {
            images: [
              {
                link: "https://static.gettyimages.com/display-sets/creative-landing/images/GettyImages-2195074919.jpg",
                description: "Image 1",
              },
              {
                link: "https://static.gettyimages.com/display-sets/creative-landing/images/GettyImages-2195074919.jpg",
                description: "Image 1",
              },
            ],
          };
        },
      });
      app.component("my-image", MyImage);
      app.mount("#app");
    </script>
    <style>
    </style>
  </body>
</html>
